<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中 3D 探索地圖 - 智慧交通版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        .location-label {
            position: absolute; background: white; padding: 6px 14px; border-radius: 20px;
            font-weight: bold; font-size: 14px; cursor: pointer; color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transform: translate(-50%, -100%);
            border: 2px solid #e5e7eb; pointer-events: auto; white-space: nowrap;
            transition: all 0.2s ease;
        }
        .location-label:hover { 
            background: #f0fdf4; border-color: #4ade80; color: #166534; transform: translate(-50%, -110%) scale(1.05); z-index: 20; 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="relative">

    <!-- 3D 畫布容器 -->
    <div id="canvas-container"></div>

    <!-- 左上角 控制面板 -->
    <div class="absolute top-4 left-4 flex flex-col gap-3 pointer-events-auto z-10">
        <button id="daynightBtn" class="bg-white/90 backdrop-blur px-4 py-2 rounded-lg shadow-lg font-bold text-gray-700 border border-gray-200 hover:bg-gray-50 transition">
            🌞 切換為黑夜
        </button>
        <div class="bg-white/90 backdrop-blur px-4 py-2 rounded-lg shadow-lg border border-gray-200">
            <label class="text-sm font-bold text-gray-500 block mb-1">📍 瞬移至：</label>
            <select id="navSelect" class="w-full bg-transparent outline-none font-bold text-gray-800 cursor-pointer">
                <option value="">-- 選擇地點 --</option>
                <option value="0">國立勤益科技大學</option>
                <option value="1">國立臺灣美術館</option>
                <option value="2">臺中國家歌劇院</option>
                <option value="3">臺中火車站</option>
                <option value="4">臺灣府儒考棚</option>
                <option value="5">文心森林公園</option>
            </select>
        </div>
    </div>

    <!-- 右下角 交通方式 -->
    <div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur p-4 rounded-xl shadow-xl border border-gray-200 pointer-events-auto z-10">
        <h3 class="text-sm font-bold text-gray-500 mb-2">交通方式</h3>
        <div class="flex gap-2">
            <button class="transport-btn bg-green-100 border-2 border-green-500 text-green-700 px-3 py-1 rounded font-bold" data-type="walk">🚶 走路</button>
            <button class="transport-btn bg-gray-100 border-2 border-transparent text-gray-600 px-3 py-1 rounded font-bold hover:bg-gray-200" data-type="bike">🚲 腳踏車</button>
            <button class="transport-btn bg-gray-100 border-2 border-transparent text-gray-600 px-3 py-1 rounded font-bold hover:bg-gray-200" data-type="scooter">🛵 機車</button>
            <button class="transport-btn bg-gray-100 border-2 border-transparent text-gray-600 px-3 py-1 rounded font-bold hover:bg-gray-200" data-type="car">🚗 汽車</button>
        </div>
        <p class="text-xs text-gray-400 mt-2">操作說明：使用 W, A, S, D 靠右車道行駛</p>
    </div>

    <!-- 資訊卡片 (Modal) -->
    <div id="infoModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 pointer-events-auto transition-opacity">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-6 overflow-y-auto">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p id="modalSubtitle" class="text-xs font-bold tracking-widest text-gray-400 mb-1">EXPLORE TAICHUNG</p>
                        <h2 id="modalTitle" class="text-2xl font-black text-gray-800">地點名稱</h2>
                    </div>
                    <button id="closeModal" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center transition">✕</button>
                </div>
                <div class="bg-green-50 text-green-800 p-3 rounded-lg mb-5 font-medium text-sm border border-green-100" id="modalDesc">
                    場域設計與簡短說明
                </div>
                <div id="modalDetails" class="text-gray-600 text-sm leading-relaxed space-y-4"></div>
            </div>
            <div class="bg-gray-50 border-t border-gray-100 p-4 flex justify-end">
                <a id="modalMapBtn" href="#" target="_blank" class="bg-gray-800 text-white px-5 py-2 rounded-lg font-bold text-sm hover:bg-gray-700 transition flex items-center gap-2">
                    📍 在 Google Map 上查看
                </a>
            </div>
        </div>
    </div>

    <div id="labels-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <script>
        let scene, camera, renderer, dirLight, ambientLight;
        let mainChar, boyModel, bikeModel, scooterModel, carModel;
        let isNight = false;
        let streetLights = [];
        let labels = [];
        let npcs = [];
        let aiCars = [];
        let moveSpeed = 0.3; 
        let currentVehicle = 'walk'; 
        let keys = { w: false, a: false, s: false, d: false };

        const ROAD_WIDTH = 14;
        const X_ROADS = [-30, 0, 30]; 
        const Z_ROADS = [-30, 0, 30];

        // 紅綠燈狀態：true = X軸綠燈(東西向可過), false = Z軸綠燈(南北向可過)
        let trafficLightState = true; 
        let trafficTimer = 0;
        let trafficLightMeshes = [];

        const locationsData = [
            { 
                id: "01", name: "國立勤益科技大學", sub: "NCUT CAMPUS", 
                desc: "場域設計：工程與資訊管理培育基地", 
                details: `<h3 class='font-bold text-gray-800'>我們的校園與生活</h3><p>這裡不僅是學習程式語言與管理資訊的重鎮，更是大學生活的核心。從行政大樓到圖書館，從教室到溫馨的校園角落，這裡充滿了 debug 與準備專題發表的青春回憶。</p>`,
                x: -15, z: -15, teleportPos: {x: 4, z: -15}, query: "國立勤益科技大學"
            },
            { 
                id: "02", name: "國立臺灣美術館", sub: "NTMOFA", 
                desc: "場域設計：現代藝術與色彩探索", 
                details: `<h3 class='font-bold text-gray-800'>視覺美學的殿堂</h3><p>擁有寬闊綠地與現代幾何建築，常態展出本土藝術家珍貴畫作，提供介面設計與色彩學無限靈感。</p>`,
                x: 15, z: -15, teleportPos: {x: 4, z: -15}, query: "國立臺灣美術館"
            },
            { 
                id: "03", name: "臺中國家歌劇院", sub: "NATIONAL THEATER", 
                desc: "場域設計：曲牆聲學與表演藝術", 
                details: `<h3 class='font-bold text-gray-800'>獨特的洞穴曲牆結構</h3><p>由日本建築師伊東豊雄設計，無樑柱曲牆結構堪稱建築奇蹟。</p>`,
                x: -45, z: 15, teleportPos: {x: -26, z: 15}, query: "臺中國家歌劇院"
            },
            { 
                id: "04", name: "臺中火車站", sub: "TAICHUNG STATION", 
                desc: "場域設計：百年紅磚與現代金屬巨棚", 
                details: `<h3 class='font-bold text-gray-800'>城市的心臟與交通樞紐</h3><p>保留日治時期紅磚造舊站，並擴建現代金屬大頂棚新站。</p>`,
                x: 15, z: 15, teleportPos: {x: 34, z: 15}, query: "臺中火車站"
            },
            { 
                id: "05", name: "臺灣府儒考棚", sub: "GLAb", 
                desc: "場域設計：古蹟活化與質感選物咖啡", 
                details: `<h3 class='font-bold text-gray-800'>歷史與潮流的碰撞</h3><p>曾是清朝考場，結合策展與質感選物咖啡空間。</p>`,
                x: -15, z: 45, teleportPos: {x: 4, z: 34}, query: "臺灣府儒考棚"
            },
            { 
                id: "06", name: "文心森林公園", sub: "FOREST PARK", 
                desc: "場域設計：都市綠肺與圓滿戶外劇場", 
                details: `<h3 class='font-bold text-gray-800'>休閒與運動的好所在</h3><p>佔地廣大的都會公園，擁有大片草皮與戶外圓形劇場。</p>`,
                x: 45, z: -15, teleportPos: {x: 34, z: -15}, query: "臺中市文心森林公園"
            }
        ];

        // 確保 DOM 載入後才執行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function initApp() {
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 30, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(0xffdfb0, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createLand();
            buildLocations();
            createCharacter();

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', (e) => setKey(e.key.toLowerCase(), true));
            document.addEventListener('keyup', (e) => setKey(e.key.toLowerCase(), false));
            setupUI();
        }

        // 判斷是否在草地上 (供 NPC 避開馬路)
        function isPointOnGrass(x, z) {
            const halfW = ROAD_WIDTH / 2;
            for(let rx of X_ROADS) { if (Math.abs(x - rx) < halfW + 1) return false; }
            for(let rz of Z_ROADS) { if (Math.abs(z - rz) < halfW + 1) return false; }
            return true;
        }

        // 雙向道馬路結界與紅綠燈規則判定
        function canPassRoad(x, z, dx, dz) {
            const halfW = ROAD_WIDTH / 2;
            let inXRoad = false, inZRoad = false;
            
            for(let rx of X_ROADS) { if (Math.abs(x - rx) < halfW) inXRoad = true; }
            for(let rz of Z_ROADS) { if (Math.abs(z - rz) < halfW) inZRoad = true; }

            // 如果不在馬路上（在草地），直接阻擋
            if (!inXRoad && !inZRoad) return false;

            // 檢查十字路口紅綠燈
            for(let rx of X_ROADS) {
                for(let rz of Z_ROADS) {
                    if (Math.abs(x - rx) < halfW + 2 && Math.abs(z - rz) < halfW + 2) {
                        // 在十字路口範圍內：若移動方向與當前紅燈方向衝突則擋下
                        if (trafficLightState) {
                            // X軸綠燈，Z軸紅燈：若沿 Z 軸移動則禁止
                            if (Math.abs(dz) > 0 && Math.abs(dx) === 0) return false;
                        } else {
                            // Z軸綠燈，X軸紅燈：若沿 X 軸移動則禁止
                            if (Math.abs(dx) > 0 && Math.abs(dz) === 0) return false;
                        }
                    }
                }
            }
            return true;
        }

        function createLand() {
            const planeGeo = new THREE.PlaneGeometry(200, 200);
            const planeMat = new THREE.MeshLambertMaterial({ color: 0x8DA973 });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);

            // 雙向道馬路與中心白色虛線
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x4a4a4a });
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            X_ROADS.forEach(x => {
                const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 200), roadMat);
                road.rotation.x = -Math.PI / 2;
                road.position.set(x, 0.1, 0);
                road.receiveShadow = true;
                scene.add(road);
                // 中心虛線
                for(let z = -90; z < 90; z += 6) {
                    const line = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3), lineMat);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(x, 0.13, z);
                    scene.add(line);
                }
            });

            Z_ROADS.forEach(z => {
                const road = new THREE.Mesh(new THREE.PlaneGeometry(200, ROAD_WIDTH), roadMat);
                road.rotation.x = -Math.PI / 2;
                road.position.set(0, 0.12, z); 
                road.receiveShadow = true;
                scene.add(road);
                // 中心虛線
                for(let x = -90; x < 90; x += 6) {
                    const line = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), lineMat);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(x, 0.14, z);
                    scene.add(line);
                }
            });

            // 生成環境裝飾與會動的 NPC
            for (let i = 0; i < 120; i++) {
                let rx = (Math.random() - 0.5) * 160;
                let rz = (Math.random() - 0.5) * 160;
                if (!isPointOnGrass(rx, rz)) continue;

                let rand = Math.random();
                if (rand < 0.4) createTree(rx, rz);
                else if (rand < 0.6) {
                    const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 1.5 + 0.5), new THREE.MeshLambertMaterial({ color: 0x7a8b8b }));
                    stone.position.set(rx, 0, rz);
                    stone.castShadow = true;
                    scene.add(stone);
                } else if (rand < 0.8) createFlower(rx, rz);
                else createNPC(rx, rz);
            }

            // 生成路燈與紅綠燈
            const lampMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
            X_ROADS.forEach(x => {
                for(let z = -80; z <= 80; z += 40) {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), lampMat);
                    pole.position.set(x + ROAD_WIDTH/2 + 1, 3, z);
                    pole.castShadow = true;
                    scene.add(pole);
                    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.5), glowMat);
                    bulb.position.set(x + ROAD_WIDTH/2 + 1, 6, z);
                    scene.add(bulb);
                    const light = new THREE.PointLight(0xffaa00, 0, 30);
                    light.position.set(x + ROAD_WIDTH/2 + 1, 5, z);
                    scene.add(light);
                    streetLights.push(light);
                }
            });

            // 十字路口紅綠燈模型
            X_ROADS.forEach(rx => {
                Z_ROADS.forEach(rz => {
                    const tlGroup = new THREE.Group();
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 7), lampMat);
                    post.position.set(rx + ROAD_WIDTH/2, 3.5, rz + ROAD_WIDTH/2);
                    tlGroup.add(post);

                    const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), lampMat);
                    box.position.set(rx + ROAD_WIDTH/2, 6.5, rz + ROAD_WIDTH/2);
                    tlGroup.add(box);

                    const redLight = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                    redLight.position.set(rx + ROAD_WIDTH/2, 7, rz + ROAD_WIDTH/2 + 0.41);
                    tlGroup.add(redLight);

                    const greenLight = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
                    greenLight.position.set(rx + ROAD_WIDTH/2, 6, rz + ROAD_WIDTH/2 + 0.41);
                    tlGroup.add(greenLight);

                    scene.add(tlGroup);
                    trafficLightMeshes.push({ red: redLight, green: greenLight, x: rx, z: rz });
                });
            });

            // 生成路上行駛的 AI 車流
            for(let i = 0; i < 6; i++) {
                createAICar();
            }
        }

        function createTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 3, 5), new THREE.MeshLambertMaterial({ color: 0x5D4037 }));
            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5, 5), new THREE.MeshLambertMaterial({ color: 0x4CAF50 }));
            leaves.position.set(x, 4.5, z);
            leaves.castShadow = true;
            scene.add(trunk);
            scene.add(leaves);
        }

        function createFlower(x, z) {
            const colors = [0xff99aa, 0xffff66, 0xaa99ff, 0xffffff];
            const flower = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), new THREE.MeshLambertMaterial({ color: colors[Math.floor(Math.random() * colors.length)] }));
            flower.position.set(x, 0.3, z);
            scene.add(flower);
        }

        function createNPC(x, z) {
            const shirtColors = [0xdd3333, 0x3344dd, 0xddaa11, 0xeeeeee];
            const npcGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 1), new THREE.MeshLambertMaterial({ color: shirtColors[Math.floor(Math.random() * shirtColors.length)] }));
            body.position.y = 1.5;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
            head.position.y = 2.8;
            npcGroup.add(body); npcGroup.add(head);
            npcGroup.position.set(x, 0, z);
            scene.add(npcGroup);

            npcs.push({
                mesh: npcGroup,
                x: x, z: z,
                angle: Math.random() * Math.PI * 2,
                speed: 0.05 + Math.random() * 0.05
            });
        }

        function createAICar() {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
            const bottom = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 4.5), bodyMat);
            bottom.position.y = 0.8;
            car.add(bottom);
            scene.add(car);

            aiCars.push({
                mesh: car,
                x: X_ROADS[Math.floor(Math.random() * X_ROADS.length)] + 2,
                z: (Math.random() - 0.5) * 140,
                speed: 0.4 + Math.random() * 0.3,
                dir: 1
            });
        }

        function buildLocations() {
            const container = document.getElementById('labels-container');
            const mat = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });

            locationsData.forEach(loc => {
                const building = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), mat);
                base.position.y = 2;
                base.castShadow = true;
                building.add(base);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 3, 4), new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff }));
                roof.position.y = 5.5;
                roof.rotation.y = Math.PI / 4;
                building.add(roof);

                building.position.set(loc.x, 0, loc.z);
                scene.add(building);

                const label = document.createElement('div');
                label.className = 'location-label';
                label.innerHTML = `<span class="text-orange-600">${loc.id}</span> ${loc.name}`;
                container.appendChild(label);

                label.addEventListener('click', () => {
                    document.getElementById('modalTitle').innerText = loc.name;
                    document.getElementById('modalSubtitle').innerText = loc.sub;
                    document.getElementById('modalDesc').innerText = loc.desc;
                    document.getElementById('modalDetails').innerHTML = loc.details;
                    document.getElementById('modalMapBtn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.query)}`;
                    document.getElementById('infoModal').classList.remove('hidden');
                });

                labels.push({ element: label, position: new THREE.Vector3(loc.x, 7, loc.z) });
            });
        }

        function createCharacter() {
            mainChar = new THREE.Group();
            
            boyModel = new THREE.Group();
            const skin = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffddaa }));
            skin.position.y = 3.8;
            const hair = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 1.1), new THREE.MeshLambertMaterial({ color: 0x222222 }));
            hair.position.y = 4.4;
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), new THREE.MeshLambertMaterial({ color: 0x334455 }));
            body.position.y = 2.5;
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            legL.position.set(-0.3, 0.8, 0);
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            legR.position.set(0.3, 0.8, 0);
            boyModel.add(skin); boyModel.add(hair); boyModel.add(body); boyModel.add(legL); boyModel.add(legR);
            boyModel.castShadow = true;

            bikeModel = new THREE.Group();
            const bikeFrame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 2.5), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
            bikeFrame.position.y = 1.2;
            bikeModel.add(bikeFrame);
            bikeModel.visible = false;

            scooterModel = new THREE.Group();
            const scooterBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 3), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
            scooterBody.position.y = 1.2;
            scooterModel.add(scooterBody);
            scooterModel.visible = false;

            carModel = new THREE.Group();
            const carBottom = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 5), new THREE.MeshLambertMaterial({ color: 0x3b82f6 }));
            carBottom.position.y = 1;
            const carTop = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 2.5), new THREE.MeshLambertMaterial({ color: 0xffffff }));
            carTop.position.set(0, 2.2, -0.5);
            carModel.add(carBottom); carModel.add(carTop);
            carModel.visible = false;

            mainChar.add(boyModel); mainChar.add(bikeModel); mainChar.add(scooterModel); mainChar.add(carModel);
            // 初始位置在道路右側車道
            mainChar.position.set(4, 0, 4);
            scene.add(mainChar);
        }

        function setupUI() {
            const btns = document.querySelectorAll('.transport-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    btns.forEach(b => {
                        b.classList.remove('bg-green-100', 'border-green-500', 'text-green-700');
                        b.classList.add('bg-gray-100', 'border-transparent', 'text-gray-600');
                    });
                    const target = e.target;
                    target.classList.remove('bg-gray-100', 'border-transparent', 'text-gray-600');
                    target.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                    
                    currentVehicle = target.dataset.type;
                    boyModel.visible = false; bikeModel.visible = false;
                    scooterModel.visible = false; carModel.visible = false;

                    if (currentVehicle === 'walk') { boyModel.visible = true; moveSpeed = 0.3; }
                    if (currentVehicle === 'bike') { boyModel.visible = true; bikeModel.visible = true; moveSpeed = 0.6; boyModel.position.y = 1.2; }
                    if (currentVehicle === 'scooter') { boyModel.visible = true; scooterModel.visible = true; moveSpeed = 0.9; boyModel.position.y = 1.2; }
                    if (currentVehicle === 'car') { carModel.visible = true; moveSpeed = 1.5; }
                    if (currentVehicle === 'walk') { boyModel.position.y = 0; }
                });
            });

            document.getElementById('navSelect').addEventListener('change', (e) => {
                const val = e.target.value;
                if (val !== "") {
                    const loc = locationsData[parseInt(val)];
                    mainChar.position.set(loc.teleportPos.x, 0, loc.teleportPos.z);
                    camera.position.set(loc.teleportPos.x, 30, loc.teleportPos.z + 40);
                }
            });

            const daynightBtn = document.getElementById('daynightBtn');
            daynightBtn.addEventListener('click', () => {
                isNight = !isNight;
                if (isNight) {
                    scene.background = new THREE.Color(0x1a1a2e);
                    scene.fog.color = new THREE.Color(0x1a1a2e);
                    ambientLight.intensity = 0.1;
                    dirLight.intensity = 0.1;
                    streetLights.forEach(l => l.intensity = 1);
                    daynightBtn.innerText = "🌙 切換為白天";
                } else {
                    scene.background = new THREE.Color(0x87CEEB);
                    scene.fog.color = new THREE.Color(0x87CEEB);
                    ambientLight.intensity = 0.6;
                    dirLight.intensity = 0.8;
                    streetLights.forEach(l => l.intensity = 0);
                    daynightBtn.innerText = "🌞 切換為黑夜";
                }
            });

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('infoModal').classList.add('hidden');
            });
        }

        function setKey(key, value) {
            if (key === 'w' || key === 'arrowup') keys.w = value;
            if (key === 'a' || key === 'arrowleft') keys.a = value;
            if (key === 's' || key === 'arrowdown') keys.s = value;
            if (key === 'd' || key === 'arrowright') keys.d = value;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 紅綠燈定時切換 (每 6 秒)
            trafficTimer += 1;
            if (trafficTimer > 360) {
                trafficLightState = !trafficLightState;
                trafficTimer = 0;
            }

            // 更新紅綠燈燈號材質
            trafficLightMeshes.forEach(tl => {
                if (trafficLightState) {
                    tl.green.material.color.setHex(0x00ff00);
                    tl.red.material.color.setHex(0x330000);
                } else {
                    tl.green.material.color.setHex(0x003300);
                    tl.red.material.color.setHex(0xff0000);
                }
            });

            // 玩家 WASD 移動與紅綠燈 / 道路結界檢驗
            let dx = 0, dz = 0;
            if (keys.w) dz -= moveSpeed;
            if (keys.s) dz += moveSpeed;
            if (keys.a) dx -= moveSpeed;
            if (keys.d) dx += moveSpeed;

            if (dx !== 0 || dz !== 0) {
                let nextX = mainChar.position.x + dx;
                let nextZ = mainChar.position.z + dz;
                
                if (canPassRoad(nextX, nextZ, dx, dz)) {
                    mainChar.position.x = nextX;
                    mainChar.position.z = nextZ;
                    mainChar.rotation.y = Math.atan2(dx, dz);
                    mainChar.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * (currentVehicle === 'walk' ? 0.5 : 0.2);
                }
            } else {
                mainChar.position.y = 0;
            }

            // NPC 行人自動走動與避開馬路
            npcs.forEach(npc => {
                let ndx = Math.sin(npc.angle) * npc.speed;
                let ndz = Math.cos(npc.angle) * npc.speed;
                let nx = npc.mesh.position.x + ndx;
                let nz = npc.mesh.position.z + ndz;

                if (isPointOnGrass(nx, nz)) {
                    npc.mesh.position.x = nx;
                    npc.mesh.position.z = nz;
                    npc.mesh.position.y = Math.abs(Math.sin(Date.now() * 0.01 + npc.x)) * 0.3;
                } else {
                    npc.angle += Math.PI * 0.6; // 碰到馬路邊緣自動轉向
                }
            });

            // AI 車流移動
            aiCars.forEach(car => {
                car.z += car.speed * car.dir;
                if (Math.abs(car.z) > 90) car.dir *= -1;
                car.mesh.position.set(car.x, 0, car.z);
            });

            // 相機跟隨
            camera.position.x += (mainChar.position.x - camera.position.x) * 0.1;
            camera.position.z += (mainChar.position.z + 40 - camera.position.z) * 0.1;
            camera.lookAt(mainChar.position);

            // 標籤 2D 投影
            labels.forEach(l => {
                const pos = l.position.clone();
                pos.project(camera);
                const x = (pos.x *  .5 + .5) * window.innerWidth;
                const y = (pos.y * -.5 + .5) * window.innerHeight;
                if (pos.z > 1) {
                    l.element.style.display = 'none';
                } else {
                    l.element.style.display = 'block';
                    l.element.style.left = `${x}px`;
                    l.element.style.top = `${y}px`;
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
